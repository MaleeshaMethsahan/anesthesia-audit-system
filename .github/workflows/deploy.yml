name: Deploy to DigitalOcean

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT || 22 }}
          script_stop: true
          script: |
            cd /var/www/anesthesia-audit-system

            # Enable maintenance mode
            php artisan down || true

            # Pull latest changes
            git fetch origin main
            git reset --hard origin/main

            # Install PHP dependencies
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # Install & build Vite frontend assets
            npm ci --no-audit --prefer-offline
            npm run build

            # Run database migrations
            php artisan migrate --force

            # Optimize cache for production
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Set correct storage & cache permissions
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            # Exit maintenance mode
            php artisan up

            # Reload PHP-FPM service (handles both 8.2 or 8.3)
            sudo systemctl reload php8.2-fpm || sudo systemctl reload php8.3-fpm || true
